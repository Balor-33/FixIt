name: fixit
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.3
  # Image Picking
  image_picker: ^1.0.7
  # AI Image Recognition — FREE on-device ML
  google_mlkit_image_labeling: ^0.10.0
  google_mlkit_object_detection: ^0.11.0
  # HTTP & Crypto for Cloudinary upload
  http: ^1.2.0
  crypto: ^3.0.3
  # Icons
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  
  # 🔐 Add .env file for secure API keys and app assets
  assets:
    - .env
    - assets/images/

# Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/FixIt_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/FixIt_logo.png"